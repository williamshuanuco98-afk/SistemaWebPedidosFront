<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INPLABEL | Sistema de Gestión de Pedidos y Envíos</title>
  <meta name="description" content="Plataforma web para la gestión integral de pedidos, guías de remisión y envíos.">

  <!-- Google Fonts: Sora & Manrope -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- Bootstrap 5.3 CSS & JS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Chart.js 4 Library -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css?v=800.0">
</head>

<body>

  <div class="app-container">
    <!-- Vertical Sidebar (Dark Minimalist) -->
    <aside id="sidebar" class="sidebar">
      <div>
        <div class="sidebar-header">
          <a href="#dashboard" class="brand-logo" onclick="app.navigateTo('dashboard')">
            <img id="brandLogoImg" src="img/inplabel-logo.png" alt="Inplabel" class="brand-logo-img">
          </a>
          <button id="toggleSidebarBtn" class="toggle-sidebar-btn" title="Alternar menú">
            <i class="bi bi-chevron-left"></i>
          </button>
        </div>

        <nav class="sidebar-nav">

          <button class="nav-item active" data-route="dashboard" onclick="app.navigateTo('dashboard')">
            <i class="bi bi-grid-1x2-fill icon"></i>
            <span class="nav-label">Dashboard</span>
          </button>

          <button class="nav-item" data-route="pedidos" onclick="app.navigateTo('pedidos')">
            <i class="bi bi-cart-check-fill icon"></i>
            <span class="nav-label">Pedidos</span>
            <span id="badgePedidos" class="badge-count d-none">0</span>
          </button>

          <button class="nav-item" data-route="envios" onclick="app.navigateTo('envios')">
            <i class="bi bi-truck icon"></i>
            <span class="nav-label">Guías</span>
            <span id="badgeEnvios" class="badge-count d-none">0</span>
          </button>

          <button class="nav-item" data-route="clientes" onclick="app.navigateTo('clientes')">
            <i class="bi bi-people-fill icon"></i>
            <span class="nav-label">Clientes</span>
          </button>

          <button class="nav-item" data-route="productos" onclick="app.navigateTo('productos')">
            <i class="bi bi-box-seam-fill icon"></i>
            <span class="nav-label">Productos</span>
          </button>
        </nav>
      </div>

      <div class="sidebar-footer">
        <button class="nav-item mb-2" data-route="config" title="Configuración del Sistema" onclick="app.navigateTo('config')">
          <i class="bi bi-gear-fill icon"></i>
          <span class="nav-label">Configuración</span>
        </button>
        <div class="user-profile">
          <div class="user-avatar">IN</div>
          <div class="user-info">
            <span class="user-name">Operaciones Inplabel</span>
            <span class="user-role">Spring Boot + MySQL</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="main-content">

      <!-- Header Bar (Glassmorphism Header) -->
      <header class="top-header">
        <div class="d-flex align-items-center gap-3">
          <h2 id="pageTitle" class="page-title d-flex align-items-center">
            <i class="bi bi-speedometer2 text-primary"></i>
            <span>Panel General de Control</span>
          </h2>
        </div>

        <div class="d-flex align-items-center gap-3">
          <div id="backendStatusIndicator" class="status-badge PENDIENTE py-2 px-3 fs-7"
            style="background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe;">
            <i class="bi bi-arrow-repeat spin me-1"></i> Verificando Backend...
          </div>

          <!-- Fixed-Width Stationed Custom Theme Switch Control -->
          <div class="custom-switch-container" onclick="app.toggleTheme()">
            <i class="bi bi-sun-fill text-warning fs-6"></i>
            <div class="custom-switch-track">
              <div class="custom-switch-handle"></div>
            </div>
            <i class="bi bi-moon-stars-fill text-primary fs-6"></i>
            <span id="themeToggleLabel" class="d-none d-md-inline fw-semibold fs-7">Modo Claro</span>
          </div>
        </div>
      </header>

      <!-- Dynamic View Container -->
      <div id="viewContainer" class="page-body"></div>
    </main>
  </div>

  <!-- Detalle Pedido Modal -->
  <div class="modal fade" id="orderDetailModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 id="orderDetailTitle" class="modal-title fw-bold">Detalle de Pedido</h5>
          <div class="d-flex gap-2">
            <button class="btn btn-sm btn-outline-secondary" onclick="window.print()"><i class="bi bi-printer"></i> Imprimir</button>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
        </div>
        <div id="orderDetailBody" class="modal-body"></div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Application Scripts -->
  <script src="js/api.js?v=800.0"></script>
  <script src="js/app.js?v=800.0"></script>
</body>

</html>
