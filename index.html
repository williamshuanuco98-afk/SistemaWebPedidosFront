<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      var CURRENT_VER = '2026.10.06.v402';
      var savedVer = localStorage.getItem('inplabel_sys_ver');
      if (savedVer !== CURRENT_VER) {
        localStorage.setItem('inplabel_sys_ver', CURRENT_VER);
        if (savedVer) {
          window.location.reload(true);
          return;
        }
      }

      var theme = localStorage.getItem('inplabel_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('data-bs-theme', theme);

      // Auto-redirect if opened directly via file:// protocol (which blocks ES6 modules)
      if (window.location.protocol === 'file:') {
        window.location.href = 'http://localhost:8080';
      }
    })();
  </script>

  <title>OPERIX | Sistema de Gestión de Pedidos y Envíos</title>
  <meta name="description" content="Plataforma web para la gestión integral de pedidos, guías de remisión y envíos.">

  <!-- Favicon & Icons -->
  <link rel="icon" type="image/x-icon" href="img/favicon.ico?v=operix1">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png?v=operix1">
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png?v=operix1">
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png?v=operix1">

  <!-- Google Fonts: Sora & Manrope -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&display=swap"

  <!-- Bootstrap 5.3 CSS & JS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="js/flatpickr.es.js"></script>

  <!-- Pre-render auth check to immediately prevent FOUC / flash on page reload -->
  <script>
    (function () {
      try {
        var isAuth = Boolean(localStorage.getItem('inplabel_user'));
        if (!isAuth) {
          document.documentElement.classList.add('unauthenticated');
        }
      } catch (e) { }
    })();
  </script>

  <!-- Universal Self-Healing Engine for Instant Connectivity and Click Protection -->
  <script>
    (function () {
      function forceUnlock() {
        if (!document.body) return;
        document.body.classList.remove('modal-open');
        document.body.style.removeProperty('overflow');
        document.body.style.removeProperty('padding-right');
        document.body.style.removeProperty('pointer-events');
        document.querySelectorAll('.modal-backdrop').forEach(function (b) { b.remove(); });
        document.querySelectorAll('.modal').forEach(function (m) {
          if (!m.classList.contains('show')) {
            m.style.removeProperty('display');
            m.style.removeProperty('pointer-events');
          }
        });
      }

      forceUnlock();
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', forceUnlock);
      } else {
        setTimeout(forceUnlock, 50);
      }

      var host = (window.location && window.location.hostname && window.location.hostname.trim() !== '') ? window.location.hostname : 'localhost';
      var port = (window.location && window.location.port) ? window.location.port : '8080';
      var is8080 = (window.location.protocol.indexOf('http') === 0 && port === '8080');
      var baseUrl = is8080 ? '/api' : ('http://' + host + ':8080/api');

      function updateStatusBadge(connected) {
        var indicator = document.getElementById('backendStatusIndicator');
        if (indicator) {
          indicator.removeAttribute('style');
          if (connected) {
            indicator.className = 'status-badge ACTIVA py-2 px-3 fs-7';
            indicator.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i> Spring Boot: Conectado a MySQL';
          } else {
            indicator.className = 'status-badge CANCELADO py-2 px-3 fs-7';
            indicator.innerHTML = '<i class="bi bi-exclamation-triangle-fill me-1"></i> Spring Boot: Desconectado';
          }
        }
      }

      function runConnectivityCheck() {
        fetch(baseUrl + '/status', { cache: 'no-store' })
          .then(function (res) { return res.json(); })
          .then(function (data) {
            if (data && data.connected) {
              updateStatusBadge(true);
            } else {
              updateStatusBadge(false);
            }
          })
          .catch(function () {
            updateStatusBadge(false);
          });
      }

      runConnectivityCheck();
      setInterval(runConnectivityCheck, 10000);
    })();
  </script>

</head>
